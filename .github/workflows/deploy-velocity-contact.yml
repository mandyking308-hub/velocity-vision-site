name: Deploy Velocity contact function

on:
  push:
    paths:
      - 'deploy-trigger/velocity-contact.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fdubhpzthtfzrzkjkalw
    steps:
      - uses: actions/checkout@v4

      - name: Deploy corrected notify-contact function
        id: deploy
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            printf 'status=failed\nreason=SUPABASE_ACCESS_TOKEN secret is not configured\n' > test-results/velocity-contact-deploy.txt
            exit 0
          fi

          npx --yes supabase@latest functions deploy notify-contact \
            --project-ref "${PROJECT_REF}" \
            > /tmp/deploy.log 2>&1
          CODE=$?

          if [ "$CODE" -eq 0 ]; then
            printf 'status=deployed\nproject_ref=%s\nfunction=notify-contact\n' "$PROJECT_REF" > test-results/velocity-contact-deploy.txt
          else
            printf 'status=failed\nexit_code=%s\n' "$CODE" > test-results/velocity-contact-deploy.txt
            tail -n 40 /tmp/deploy.log >> test-results/velocity-contact-deploy.txt
          fi
          exit 0

      - name: Record deployment result
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/velocity-contact-deploy.txt
          git commit -m 'Record Velocity contact deployment result' || exit 0
          git push
