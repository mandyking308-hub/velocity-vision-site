name: Velocity live contact deployment and test

on:
  push:
    paths:
      - '.github/workflows/velocity-contact-live-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect deployment access
        shell: bash
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'TOKEN_AVAILABLE=true' >> "$GITHUB_ENV"
          else
            echo 'TOKEN_AVAILABLE=false' >> "$GITHUB_ENV"
          fi

      - name: Deploy corrected contact function
        if: env.TOKEN_AVAILABLE == 'true'
        shell: bash
        run: |
          set +e
          set -a
          source .env
          set +a
          mkdir -p test-results
          npx --yes supabase@latest functions deploy notify-contact \
            --project-ref "${VITE_SUPABASE_PROJECT_ID}" \
            > test-results/velocity-contact-deploy.log 2>&1
          STATUS=$?
          echo "${STATUS}" > test-results/velocity-contact-deploy.status
          exit 0

      - name: Record unavailable deployment access
        if: env.TOKEN_AVAILABLE != 'true'
        shell: bash
        run: |
          mkdir -p test-results
          echo 'No SUPABASE_ACCESS_TOKEN repository secret was available.' > test-results/velocity-contact-deploy.log
          echo '99' > test-results/velocity-contact-deploy.status

      - name: Wait for edge propagation
        shell: bash
        run: sleep 15

      - name: Submit one labelled enquiry to the live contact backend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a

          mkdir -p test-results
          TESTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DEPLOY_STATUS="$(cat test-results/velocity-contact-deploy.status)"
          PAYLOAD="$(jq -n \
            --arg name 'Velocity Live Test 2' \
            --arg email 'mandyking308+velocity-live-test-2@gmail.com' \
            --arg company 'Global Solutions Management LLC' \
            --arg message "Post-deployment production contact-form test at ${TESTED_AT}. Please treat this as a test enquiry." \
            --arg route 'general_support' \
            '{name:$name,email:$email,company:$company,message:$message,route:$route}')"

          RAW="$(curl --silent --show-error \
            --request POST \
            --header "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data "${PAYLOAD}" \
            --write-out $'\n%{http_code}' \
            "${VITE_SUPABASE_URL}/functions/v1/notify-contact")"

          HTTP_STATUS="$(printf '%s\n' "${RAW}" | tail -n 1)"
          RESPONSE_BODY="$(printf '%s\n' "${RAW}" | sed '$d')"

          jq -n \
            --arg tested_at "${TESTED_AT}" \
            --arg deployment_status "${DEPLOY_STATUS}" \
            --arg endpoint "${VITE_SUPABASE_URL}/functions/v1/notify-contact" \
            --arg http_status "${HTTP_STATUS}" \
            --arg response_body "${RESPONSE_BODY}" \
            '{tested_at:$tested_at,deployment_status:($deployment_status|tonumber),endpoint:$endpoint,http_status:($http_status|tonumber),response_body:$response_body}' \
            > test-results/velocity-contact-live-test.json

      - name: Save deployment and test results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/velocity-contact-deploy.log test-results/velocity-contact-deploy.status test-results/velocity-contact-live-test.json
          git commit -m 'Record Velocity deployment and live contact test'
          git push
